<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIIT Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0f0f1a; color: white; min-height: 100vh; font-family: 'Segoe UI', sans-serif; }
        .navbar-custom {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .navbar-brand {
            color: #e94560;
            font-size: 1.5rem;
            font-weight: 700;
            text-decoration: none;
        }
        .search-wrap { display: flex; gap: 10px; align-items: center; }
        .search-box {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            border-radius: 25px;
            padding: 10px 20px;
            width: 320px;
            outline: none;
        }
        .search-box:focus { border-color: #e94560; }
        .search-box::placeholder { color: rgba(255,255,255,0.4); }
        .btn-search {
            background: #e94560;
            border: none;
            border-radius: 25px;
            padding: 10px 20px;
            color: white;
            cursor: pointer;
        }
        .btn-admin {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 25px;
            padding: 8px 18px;
            color: white;
            text-decoration: none;
            font-size: 0.85rem;
        }
        .btn-admin:hover { border-color: #e94560; color: #e94560; }
        .hero {
            background: linear-gradient(135deg, #1a1a2e, #0f3460);
            padding: 50px 30px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .hero h1 { color: #e94560; font-size: 2.5rem; font-weight: 700; margin-bottom: 10px; }
        .hero p { color: rgba(255,255,255,0.6); font-size: 1.1rem; }
        .stats { display: flex; justify-content: center; gap: 40px; margin-top: 20px; }
        .stat-item { text-align: center; }
        .stat-number { font-size: 2rem; font-weight: 700; color: #e94560; }
        .stat-label { color: rgba(255,255,255,0.5); font-size: 0.85rem; }
        .filter-bar {
            background: rgba(26,26,46,0.8);
            padding: 15px 30px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .filter-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.7);
            border-radius: 20px;
            padding: 6px 16px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .filter-btn:hover, .filter-btn.active {
            background: rgba(233,69,96,0.2);
            border-color: #e94560;
            color: #e94560;
        }
        .books-grid {
            padding: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }
        .book-card {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 15px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }
        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(233,69,96,0.2);
            border-color: rgba(233,69,96,0.3);
        }
        .book-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .book-img-placeholder {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #0f3460, #16213e);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            color: rgba(255,255,255,0.15);
        }
        .book-body { padding: 12px; }
        .book-title { font-size: 0.9rem; font-weight: 700; color: white; margin-bottom: 4px; line-height: 1.3; }
        .book-author { color: rgba(255,255,255,0.5); font-size: 0.78rem; margin-bottom: 8px; }
        .book-footer { display: flex; justify-content: space-between; align-items: center; }
        .badge-cat {
            background: rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.6);
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 0.7rem;
        }
        .badge-available {
            background: rgba(25,135,84,0.2);
            color: #28a745;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 0.7rem;
        }
        .badge-unavailable {
            background: rgba(233,69,96,0.15);
            color: #e94560;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 0.7rem;
        }
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: rgba(255,255,255,0.3);
        }
        .empty-state i { font-size: 4rem; margin-bottom: 15px; }
        .loading {
            text-align: center;
            padding: 80px;
            color: rgba(255,255,255,0.4);
        }
        .loading i { font-size: 2rem; animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        #resultInfo {
            padding: 10px 30px;
            color: rgba(255,255,255,0.4);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar-custom">
    <a href="#" class="navbar-brand">
        <i class="fas fa-book-open me-2"></i>DIIT Library
    </a>
    <div class="search-wrap">
        <input type="text" id="searchInput" class="search-box"
               placeholder="Search by title, author, category...">
        <button class="btn-search" onclick="doSearch()">
            <i class="fas fa-search"></i>
        </button>
    </div>
    <a href="https://web-production-0cace.up.railway.app/admin" class="btn-admin" target="_blank">
        <i class="fas fa-lock me-1"></i> Admin
    </a>
</nav>

<!-- Hero -->
<div class="hero">
    <h1><i class="fas fa-book-open me-3"></i>Our Book Collection</h1>
    <p>Browse and discover books from our library</p>
    <div class="stats">
        <div class="stat-item">
            <div class="stat-number" id="totalBooks">—</div>
            <div class="stat-label">Total Books</div>
        </div>
        <div class="stat-item">
            <div class="stat-number" id="availableBooks">—</div>
            <div class="stat-label">Available</div>
        </div>
    </div>
</div>

<!-- Filter Bar -->
<div class="filter-bar" id="filterBar">
    <span style="color: rgba(255,255,255,0.4); font-size:0.85rem;">Category:</span>
    <button class="filter-btn active" onclick="filterCategory('')" id="cat-all">All</button>
</div>

<!-- Result Info -->
<div id="resultInfo"></div>

<!-- Books Grid -->
<div id="booksGrid" class="books-grid">
    <div class="loading" style="grid-column:1/-1">
        <i class="fas fa-spinner"></i>
        <p style="margin-top:15px">Loading books...</p>
    </div>
</div>

<script>
const API = 'https://web-production-0cace.up.railway.app';
let currentCategory = '';
let currentSearch = '';
let allBooks = [];

async function loadCategories() {
    try {
        const res = await fetch(`${API}/api/categories`);
        const cats = await res.json();
        const bar = document.getElementById('filterBar');
        cats.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = 'filter-btn';
            btn.id = `cat-${cat}`;
            btn.textContent = cat;
            btn.onclick = () => filterCategory(cat);
            bar.appendChild(btn);
        });
    } catch(e) { console.error(e); }
}

async function loadBooks(search = '', category = '') {
    const grid = document.getElementById('booksGrid');
    grid.innerHTML = '<div class="loading" style="grid-column:1/-1"><i class="fas fa-spinner"></i><p style="margin-top:15px">Loading...</p></div>';

    let url = `${API}/api/books?`;
    if (search) url += `q=${encodeURIComponent(search)}&`;
    if (category) url += `category=${encodeURIComponent(category)}`;

    try {
        const res = await fetch(url);
        const data = await res.json();
        allBooks = data.books;
        renderBooks(data.books);
        updateStats(data.books);
        document.getElementById('resultInfo').textContent =
            search || category ? `${data.count} books found` : '';
    } catch(e) {
        grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><i class="fas fa-exclamation-circle"></i><p>Could not load books. Please try again.</p></div>';
    }
}

function renderBooks(books) {
    const grid = document.getElementById('booksGrid');
    if (!books.length) {
        grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><i class="fas fa-search"></i><p>No books found</p></div>';
        return;
    }
    grid.innerHTML = books.map(b => `
        <div class="book-card">
            ${b.photo_url
                ? `<img src="${b.photo_url}" alt="${b.title}" class="book-img" onerror="this.parentElement.querySelector('.book-img-placeholder') && (this.style.display='none')">`
                : `<div class="book-img-placeholder"><i class="fas fa-book"></i></div>`
            }
            <div class="book-body">
                <div class="book-title">${b.title}</div>
                <div class="book-author">${b.author}</div>
                <div class="book-footer">
                    <span class="badge-cat">${b.category}</span>
                    ${b.available_copies > 0
                        ? `<span class="badge-available">${b.available_copies} available</span>`
                        : `<span class="badge-unavailable">Unavailable</span>`
                    }
                </div>
            </div>
        </div>
    `).join('');
}

function updateStats(books) {
    document.getElementById('totalBooks').textContent = books.length;
    const available = books.filter(b => b.available_copies > 0).length;
    document.getElementById('availableBooks').textContent = available;
}

function filterCategory(cat) {
    currentCategory = cat;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(cat ? `cat-${cat}` : 'cat-all').classList.add('active');
    loadBooks(currentSearch, cat);
}

function doSearch() {
    currentSearch = document.getElementById('searchInput').value.trim();
    loadBooks(currentSearch, currentCategory);
}

document.getElementById('searchInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') doSearch();
});

// Init
loadCategories();
loadBooks();
</script>
</body>
</html>
